[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | \.venv_ci
  | __pycache__
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
markers = [
    "integration: requires external services such as PostgreSQL",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peacemusic"
version = "2.0.0a1"
description = "A Discord music and AI assistant bot"
requires-python = ">=3.12"
dependencies = [
    "discord.py[voice]>=2.7,<3",
    "google-genai>=1.65,<2",
    "aiohttp>=3.13,<4",
    "httpx[socks]>=0.28,<1",
    "numpy>=2.3,<3",
    "yt-dlp>=2026.7,<2027",
    "langchain>=1,<2",
    "langchain-google-genai>=4,<5",
    "asyncpg>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.16,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
]

[dependency-groups]
dev = [
    "black==26.1.0",
    "flake8==7.3.0",
    "isort==7.0.0",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
]

[project.scripts]
peacemusic-v2 = "peacemusic.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
