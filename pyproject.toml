[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | \.venv_ci
  | __pycache__
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "peacemusic"
version = "2.0.0a1"
description = "A Discord music and AI assistant bot"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13,<4",
    "asyncpg>=0.30,<1",
    "alembic>=1.16,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
]

[project.scripts]
peacemusic-v2 = "peacemusic.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
