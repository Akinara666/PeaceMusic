services:
  peacemusic:
    build: .
    image: ghcr.io/akinara666/peacemusic:latest
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Ротация логов, чтобы не забить весь диск
        max-file: "3"
    env_file:
      - .env
    extra_hosts:
      # Linux Docker Engine does not create this name automatically. host-gateway
      # keeps bridge networking while allowing access to host services (e.g. xray).
      - "host.docker.internal:host-gateway"
    environment:
      CHAT_MEMORY_DB: /app/data/chat_memory.sqlite3
      DATABASE_URL: postgresql://${POSTGRES_USER:-peacemusic}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-peacemusic}
      MUSIC_DIRECTORY: /app/music_files
      BOT_PROMPT_FILE: /app/config/prompt.txt
      YTDL_POT_PROVIDER_URL: http://bgutil-provider:4416
      # The host path is selected separately below; the app always sees this path.
      YTDL_COOKIE_FILE: /app/config/cookies.txt
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    volumes:
      # Keep writable runtime data at obvious host paths. Relative paths are
      # resolved from the directory containing this Compose file.
      - ${MUSIC_FILES_HOST_DIR:-./music_files}:/app/music_files
      - ${APP_DATA_HOST_DIR:-./data}:/app/data
      # Override BOT_PROMPT_HOST_FILE in .env to use a custom host-side prompt.
      - ${BOT_PROMPT_HOST_FILE:-./utils/default_prompt.txt}:/app/config/prompt.txt:ro
      # Keep authentication cookies on the host. yt-dlp reads and updates the
      # Netscape cookie jar, so this mount must be writable when cookies are enabled.
      # The placeholder makes cookies optional; when enabled,
      # YTDL_COOKIE_HOST_FILE must point to a writable real file.
      - ${YTDL_COOKIE_HOST_FILE:-./utils/empty_cookies.txt}:/app/config/cookies.txt:rw
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    expose:
      - "4416"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peacemusic}
      POSTGRES_USER: ${POSTGRES_USER:-peacemusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
