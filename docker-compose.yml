services:
  peacemusic:
    build: .
    image: ghcr.io/akinara666/peacemusic:latest
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m" # Ротация логов, чтобы не забить весь диск
        max-file: "3"
    env_file:
      - .env
    extra_hosts:
      # Linux Docker Engine does not create this name automatically. host-gateway
      # keeps bridge networking while allowing access to host services (e.g. xray).
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-peacemusic}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-peacemusic}
      MUSIC_DIRECTORY: /app/music_files
      YTDL_POT_PROVIDER_URL: http://bgutil-provider:4416
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    volumes:
      # Keep writable runtime data at obvious host paths. Relative paths are
      # resolved from the directory containing this Compose file.
      - ${MUSIC_FILES_HOST_DIR:-./music_files}:/app/music_files
      - ${APP_DATA_HOST_DIR:-./data}:/app/data
      - ytdlp_cache:/app/.cache/yt-dlp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    expose:
      - "4416"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peacemusic}
      POSTGRES_USER: ${POSTGRES_USER:-peacemusic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  ytdlp_cache:
