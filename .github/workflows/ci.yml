name: CI

on:
  push:
    branches: [main-v2]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint
        run: uv run flake8 src tests

      - name: Check formatting
        run: uv run black --check src tests

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests with coverage
        run: uv run pytest --cov=src/peacemusic --cov-report=term-missing --cov-fail-under=80

  integration:
    needs: [lint, test]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: peacemusic
          POSTGRES_USER: peacemusic
          POSTGRES_PASSWORD: peacemusic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peacemusic -d peacemusic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://peacemusic:peacemusic@localhost:5432/peacemusic
        run: uv run alembic upgrade head
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://peacemusic:peacemusic@localhost:5432/peacemusic
        run: uv run pytest -m integration -q

  build-and-push:
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main-v2'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main-v2') }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main-v2' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
